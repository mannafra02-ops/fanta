name: Aggiorna listone Fantacalcio

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listone
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Aggiorna listone, titolarità e indisponibili
        id: listone
        continue-on-error: true
        run: node scripts/update-listone.mjs

      - name: Aggiorna calendario e ultime formazioni ESPN
        id: espn
        continue-on-error: true
        run: node scripts/update-espn.mjs

      - name: Pubblica solo se i dati sono cambiati
        run: |
          git add data/listone-live.json data/serie-a-live.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna dati Fantacalcio e ESPN"
          git push

      - name: Segnala eventuali fonti non aggiornate
        if: steps.listone.outcome == 'failure' || steps.espn.outcome == 'failure'
        run: |
          echo "::error::Una fonte non è stata aggiornata. I dati validi delle altre fonti sono stati pubblicati; per la fonte in errore resta la copia precedente."
          exit 1
